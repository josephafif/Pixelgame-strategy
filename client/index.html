<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24170e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Realmwright</title>
<meta name="description" content="Realmwright: a real-time race for land. Push your borders, build towns that grow into pixel-art cities, ally, betray and sail.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="view" aria-label="Map of the realm"></canvas>

<div id="hud" hidden>
  <div id="hud-top">
    <div id="stats" class="chip" hidden>
      <span class="stat" title="Your share of all land"><img id="i-land" alt=""><b id="st-land"></b></span>
      <span class="stat pop" title="People (the bar shows how close you are to your limit)"><img id="i-pop" alt=""><b id="st-pop"></b></span>
      <span class="stat" title="Soldiers in the field"><img id="i-army" alt=""><b id="st-army"></b></span>
      <span class="stat" title="Gold (and its income per second)"><img id="i-gold" alt=""><b id="st-gold"></b></span>
    </div>
    <div id="top-right">
      <span id="time" class="chip"></span>
      <button id="btn-speed" class="chip" title="Game speed (Space pauses)" hidden>1×</button>
      <button id="btn-home" class="chip" title="Back to your land (H)">⌂</button>
      <button id="btn-board" class="chip" title="Leaderboard">≡</button>
      <button id="btn-menu" class="chip" title="Menu (Esc)">☰</button>
    </div>
  </div>
  <div id="board" hidden></div>
  <div id="notices" aria-live="polite"></div>
  <div id="hud-bottom">
    <div id="selbar" hidden></div>
    <div id="bar" hidden>
      <div class="army-head">
        <button id="btn-target" class="tgt" title="Choose the realm to march on (T)"><span class="dot" id="tgt-dot"></span><span id="tgt-name">Wilds</span><span class="caret">▾</span></button>
        <button id="btn-bulk" class="bulk" title="How many soldiers each drop sends (+ and − change it)">×10</button>
        <div id="build"></div>
      </div>
      <div id="cards"></div>
    </div>
  </div>
  <div id="targets" hidden></div>
</div>
<div id="popup" hidden></div>
<div id="minimap-wrap" hidden><canvas id="minimap" width="240" height="168"></canvas></div>
<div id="hint" hidden></div>
<div id="placement" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="tooltip" hidden></div>
<div id="modal-back" hidden><div id="modal"></div></div>

<script type="module" src="./main.js"></script>
</body>
</html>
